name: Build Bambaura storefront ZIP

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "tailwind.config.*"
      - "postcss.config.*"
      - ".github/workflows/build-storefront-zip.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production storefront
        run: npm run build

      - name: Verify build output
        run: |
          test -s dist/index.html
          echo "Production output verified."
          du -sh dist

      - name: Package dist ZIP
        run: zip -r bambaura-dist.zip dist

      - name: Upload downloadable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: bambaura-dist
          path: bambaura-dist.zip
          if-no-files-found: error
          retention-days: 14
